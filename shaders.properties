# --- MAIN MENU CONFIGURATION ---
# This creates a new button/tab in the Shader Options menu
screen=Petrova_Settings

# --- POPULATE THE SCREEN ---
# This lists what settings appear inside that new tab
screen.Petrova_Settings=ENABLE_PETROVA_BEAM ENABLE_ASTROPHAGE_SWARM REDSHIFT_POWER SWARM_DENSITY

# --- FORMATTING (Optional but recommended) ---
# Tell the menu which items should be sliders instead of standard buttons
sliders=REDSHIFT_POWER SWARM_DENSITY